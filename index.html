/* Mockup de marca: apariencia clara por decisión (identidad Bien Visto). Layout: barra lateral verde + área de trabajo crema; en móvil, barra inferior. */
:root{color-scheme:light;--verde:#0E6B5C;--verde-h:#0A5246;--ambar:#F2A71B;--tinta:#12302B;--crema:#FBF6EC;--menta:#E7F0EC;--blanco:#fff;--muted:#3F544E;--borde:#CFDDD6;--borde-s:#6B897E;--ambar-t:#8A5A00;--danger:#B3261E;--danger-bg:#FDF4F3;--fd:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:400 16px/1.5 var(--fb);color:var(--tinta);background:var(--crema)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
[hidden]{display:none!important}
.show-m{display:none}
.mbar,.mscrim{display:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--verde);color:var(--crema);padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:44px;height:auto;flex:none}
.brand b{font:600 18px/1 var(--fd)}.brand small{display:block;font-size:12px;opacity:.8;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15.5px;text-align:left;min-height:44px}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:rgba(251,246,236,.12)}
.nav button[aria-current=page]{background:var(--crema);color:var(--verde)}
.side .foot{margin-top:auto;font-size:13px;padding:0 8px;display:grid;gap:6px}
.side .quien{opacity:.85;overflow-wrap:anywhere}
.side .salir,.nav .nav-salir{display:flex;align-items:center;gap:10px;color:var(--crema);text-decoration:none;font-weight:600;border-radius:12px}
.side .salir{font-size:15px;padding:9px 4px;min-height:44px}
.side .salir svg,.nav .nav-salir svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .salir:hover{text-decoration:underline}
.nav .nav-salir{display:none}
main{padding:24px 32px 64px;min-width:0;max-width:1360px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:20px}
.top h1{font-size:34px;flex:1;min-width:200px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who select{width:auto;min-height:44px;padding:8px 36px 8px 14px;font-size:15px;font-weight:600;border-radius:999px;border:2px solid var(--borde-s);background:#fff;color:var(--tinta)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--menta);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:16px}
.banner.warn{background:#FCEFD3}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner button{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--verde);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px}
.kpi b{display:block;font:600 34px/1 var(--fd);color:var(--verde);font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted);display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:18px;min-width:0}
.card h2{font-size:20px;font-weight:500;margin-bottom:2px}
.card .sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:6px}
.perm-grupo{border:1px solid var(--borde);border-radius:12px;padding:12px 14px 6px;background:var(--blanco);min-width:0}
.perm-grupo h4{font:600 12.5px/1.2 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--verde);margin:0 0 6px}
.perm-item{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--menta);cursor:pointer}
.perm-grupo h4+.perm-item{border-top:0}
.perm-item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--verde);cursor:pointer}
.perm-item b{display:block;font-weight:600;font-size:15px;line-height:1.3;color:var(--tinta)}
.perm-item small{display:block;font-size:13.5px;line-height:1.35;color:var(--muted);margin-top:2px}
.btn{font:600 16px/20px var(--fb);min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--verde);color:var(--crema)}.btn.p:hover{background:var(--verde-h)}
.btn.a{background:var(--ambar);color:var(--tinta)}
.btn.s{border-color:var(--borde-s);background:transparent}.btn.s:hover{background:var(--menta)}
.btn.d{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-v{background:#DDEFE8;color:var(--verde)}.c-a{background:#FCE3AE;color:var(--ambar-t)}.c-g{background:#E9ECEB;color:var(--muted)}.c-r{background:#F7E3E1;color:var(--danger)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:14px;background:var(--verde);border-radius:0 7px 7px 0;min-width:3px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.bar.dim i{background:var(--borde-s)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:none}
.chart .ro{font-size:14px;font-weight:600;min-height:22px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.chart text{font:12px var(--fb);fill:var(--muted)}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar input[type=search],.tbar select,input.f,select.f,textarea.f{font:400 16px/22px var(--fb);min-height:44px;padding:8px 14px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta);width:100%}
.tbar input[type=search]{flex:1;min-width:180px;width:auto}
.tbar select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--borde);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font:600 12.5px/1.2 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:var(--menta);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--borde);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#F6FAF8}
td .n{font-weight:600;line-height:1.25}td .m{font-size:13px;color:var(--muted);line-height:1.3}
th .rz{position:absolute;top:0;right:0;bottom:0;width:10px;cursor:col-resize;touch-action:none;z-index:1}
th .rz:hover,th .rz.on{background:rgba(31,74,58,.16)}
th{position:relative}
.tbl-bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin:0 0 8px;font-size:14px;color:var(--muted)}
.tbl-bar span{padding:0 4px}
.tbl-bar button[disabled]{opacity:.45;cursor:default}
table.fijo{table-layout:fixed;width:100%}
table.fijo td,table.fijo th{overflow:hidden;text-overflow:ellipsis}
.folio{font:600 18px/1 var(--fd);letter-spacing:.08em;color:var(--verde)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--tinta);font:500 19px/1.2 var(--fd);margin-bottom:4px}
.sel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--tinta);color:var(--crema);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.sel select{width:auto;min-height:40px;padding:6px 12px;border-radius:999px;font-weight:600}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--verde)}
.ov{position:fixed;inset:0;background:rgba(18,48,43,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.right{justify-content:flex-end;padding:0;align-items:stretch}
.dlg{background:var(--crema);border-radius:24px;padding:24px;width:min(480px,100%);max-height:calc(100% - 16px);overflow-y:auto}
.ov.right .dlg{border-radius:24px 0 0 24px;width:min(460px,100%);max-height:none}
.dlg h2{font-size:24px;margin-bottom:6px}.dlg .sub{font-size:14.5px;color:var(--muted);margin-bottom:14px}
.fld{margin-bottom:12px}
.lbl{display:block;font:600 13px/16px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input.f[aria-invalid=true]{border-color:var(--danger);background:var(--danger-bg)}
.err{display:flex;gap:6px;color:var(--danger);font-size:14px;font-weight:600;margin-top:6px;line-height:1.35}
.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.step{background:var(--menta);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0}
.step code{background:#fff;border-radius:6px;padding:1px 6px;font-size:13.5px;word-break:break-all}
.log{list-style:none;padding:0}.log li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--borde);font-size:14.5px}
.log li:first-child{border:0}.log time{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tinta);color:var(--crema);padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;transition:.2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;margin:12px 0}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.mini{display:flex;flex-direction:column}.mini button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 0;border-top:1px solid var(--borde);min-height:52px}.mini button:first-child{border:0}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .mbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:9;background:var(--verde);color:var(--crema);padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}
 .mbtn{position:relative;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}
 .mbtn:hover{background:rgba(251,246,236,.12)}
 .mbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
 .mbadge{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--ambar);border:2px solid var(--verde)}
 .mtit{font:600 18px/1.1 var(--fd);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);height:auto;align-self:auto;gap:12px;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:0 20px 20px 0;transform:translateX(-104%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
 .side.abierto{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
 .side .nav{gap:2px}.side .nav button{min-height:44px;padding:9px 12px}.side .foot{padding-bottom:8px}
 .mscrim{display:block;position:fixed;inset:0;background:rgba(18,48,43,.55);z-index:24}
 main{padding:16px 16px 32px}.top h1{font-size:28px}
 .hide-m{display:none}.show-m{display:block}
 td,th{padding:10px 8px}.acts .btn{padding:8px 10px;font-size:13.5px;min-height:40px}.acts{flex-direction:column;align-items:stretch}
 .ov.right .dlg{border-radius:24px 24px 0 0;align-self:flex-end;width:100%;max-height:88%}.ov.right{align-items:flex-end}
 .bar{grid-template-columns:90px minmax(0,1fr) 30px}
 .toast{bottom:24px}
 .who{width:100%}.who select{flex:1}
}
@media (prefers-reduced-motion:reduce){.toast,.side{transition:none!important}}
/* resumen del administrador */
.ng{font:600 11.5px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;opacity:.7;padding:10px 12px 2px}
.nb{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--ambar);color:var(--tinta);font:600 12.5px/22px var(--fb);text-align:center;padding:0 6px}
.nav button[aria-current=page] .nb{background:var(--verde);color:var(--crema)}
.rg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.rg>.card{margin:0}
.card h2 small{font:400 14px/1 var(--fb);color:var(--muted);margin-left:6px}
.inbox{padding:12px 14px;margin-bottom:12px}
.ib-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ib-h h2{font-size:19px;margin:0}
.ib-n{min-width:30px;height:30px;border-radius:15px;background:var(--ambar);color:var(--tinta);font:600 16px/30px var(--fd);text-align:center;padding:0 9px}
.ib-n.u2{background:var(--danger);color:#fff}.inbox.ok .ib-n{background:var(--verde);color:#fff}
.ib-f{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.ib-f button{padding:4px 12px;border-radius:999px;border:2px solid var(--borde);font-weight:600;font-size:13.5px;min-height:36px;display:inline-flex;gap:7px;align-items:center;background:#fff}
.ib-f button[aria-pressed=true]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.ib-f button b{font-variant-numeric:tabular-nums}
.ib-t{font-weight:600;font-size:14px;color:var(--verde);text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}
.ib-l{list-style:none;padding:0;margin:10px 0 0;max-height:196px;overflow:auto;border-top:1px solid var(--borde)}
.ib-l li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--borde);font-size:14.5px;min-height:48px}
.ib-l li:first-child{border-top:0}
.ib-l .btn{min-height:36px;padding:4px 16px;font-size:14px}
.ct{font:600 11.5px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.dot{width:10px;height:10px;border-radius:50%;display:block}.dot.u2{background:var(--danger)}.dot.u1{background:var(--ambar)}.dot.u0{background:var(--borde-s)}
.sr{position:absolute;left:-9999px}
.mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.mt div{background:var(--menta);border-radius:12px;padding:10px 12px}.mt b{display:block;font:600 20px/1.1 var(--fd);font-variant-numeric:tabular-nums}.mt span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.kp{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px 16px;text-align:left;display:block;width:100%}
button.kp:hover{background:#F6FAF8}
.kp .l{font:600 12.5px/1.2 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kp b{display:block;font:600 32px/1.1 var(--fd);color:var(--verde);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.kp b.neg{color:var(--danger)}
.kp .s{font-size:13.5px;color:var(--muted);line-height:1.35}
.lst{display:grid;gap:10px}
.lr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:6px 12px;align-items:center;font-size:14.5px}
.lr .n{font-weight:600;line-height:1.25}.lr .n small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.lr .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lr .v small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.sb2{height:10px;border-radius:5px;background:var(--menta);overflow:hidden}.sb2 i{display:block;height:100%;background:var(--verde);border-radius:5px;min-width:3px}.sb2.g i{background:var(--borde-s)}.sb2.w i{background:var(--ambar)}.sb2.r i{background:var(--danger)}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;height:112px;margin:10px 0 4px}

.wk i{display:block;width:100%;max-width:46px;background:var(--verde);border-radius:6px 6px 0 0;min-height:3px}
.wkl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted);text-align:center}
.frm{width:100%;font-size:14.5px;border-collapse:collapse}.frm td{padding:6px 0;border:0;vertical-align:top}.frm td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.frm tr.t td{border-top:2px solid var(--tinta);padding-top:9px;font-size:16px}
.frm tr.m td{color:var(--muted);font-weight:400;font-size:13.5px}
.opp{display:flex;flex-direction:column}.opp button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 0;border-top:1px solid var(--borde);min-height:48px;width:100%}.opp button:first-child{border:0}
.opp .t{flex:1;min-width:0;font-size:14.5px;line-height:1.3}.opp .t small{display:block;color:var(--muted);font-size:13px}
.note2{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.4}
@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:860px){.lr{grid-template-columns:minmax(0,1fr) auto}.lr .sb2{grid-column:1/-1;order:3}}
@media (max-width:560px){.c3{grid-column:span 12}}
@media (max-width:860px){.ib-f{flex:1 1 100%;order:5;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.ib-f button{flex:none}.ib-h .ib-t{margin-left:auto}}
/* resumen v2 */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);background:var(--tinta);color:var(--crema);border-radius:28px;overflow:hidden;margin-bottom:12px}
.hero .hl{padding:28px 32px 26px}
.hero .hk{font-size:14.5px;opacity:.78;margin:0 0 6px}
.hero .hn{font:600 clamp(52px,6.2vw,84px)/.95 var(--fd);letter-spacing:-.015em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.hero .hn small{font:500 17px/1.2 var(--fb);letter-spacing:0;opacity:.78}
.hero .hv{font-size:17px;line-height:1.45;max-width:48ch;margin:12px 0 0}.hero .hv b{color:var(--ambar);font-weight:700}
.trk{position:relative;margin-top:48px;height:66px}
.trk .rail{position:absolute;left:0;right:0;top:26px;height:14px;border-radius:7px;background:rgba(251,246,236,.16);overflow:visible}
.trk .rail i{position:absolute;top:0;bottom:0}
.trk .fl{left:0;background:var(--ambar);border-radius:7px 0 0 7px;min-width:6px}
.trk .pr{background:repeating-linear-gradient(90deg,rgba(242,167,27,.55) 0 7px,transparent 7px 12px);border-radius:0 7px 7px 0}
.trk .mk{position:absolute;top:-7px;width:3px;height:28px;margin-left:-1.5px;background:var(--crema);border-radius:2px;text-decoration:none}
.trk .tl{position:absolute;top:0;transform:translateX(-4px);font:600 13.5px/1.2 var(--fb);white-space:nowrap}
.trk .tl.r{transform:translateX(-100%);opacity:.8;font-weight:500}
.trk .tb{position:absolute;top:46px;transform:translateX(-4px);font:500 13px/1.2 var(--fb);opacity:.85;white-space:nowrap}
.hero .hr{background:rgba(251,246,236,.07);padding:24px 28px;display:grid;gap:0;align-content:stretch}
.hs{padding:14px 0;border-top:1px solid rgba(251,246,236,.14)}.hs:first-child{border:0;padding-top:0}.hs:last-child{padding-bottom:0}
.hs span{font-size:14px;opacity:.78;display:block}

const ORDEN={};
const tablasOrdenables=()=>[...document.querySelectorAll('#main table')].filter(t=>!t.classList.contains('frm')&&!t.classList.contains('calc')&&t.tBodies[0]);
const textoCelda=(r,c)=>{const td=r.cells[c];return td?td.textContent.replace(/\s+/g,' ').trim():''};
const numCelda=s=>{const m=s.replace(/[−]/g,'-').replace(/[$,%\s]/g,'');return /^-?\d+(\.\d+)?$/.test(m)?Number(m):null};
function ordKey(t){return (S.vista==='vta'?'vta'+S.vsub:S.vista==='inv'?'inv'+S.isub:S.vista)+'|'+tablasOrdenables().indexOf(t)}
// Una columna es numérica si todos sus valores con dato son números (montos, cantidades, %). Teléfonos y folios no cuentan.
function colNumerica(t,c){const n=t.tHead.rows[0].cells.length,vals=[...t.tBodies[0].rows].filter(r=>r.cells.length===n).map(r=>textoCelda(r,c)).filter(v=>v!==''&&v!=='·');
  return vals.length>0&&vals.every(v=>numCelda(v)!==null&&v.replace(/\D/g,'').length<10)}
const vacio=s=>s===''||s==='·';
// Fechas como "9 oct" o "9 oct 2026" (sin año = año en curso).
const fechaCelda=s=>{const m=/^(\d{1,2}) ([a-z]{3})(?: (\d{4}))?/i.exec(String(s).trim());if(!m)return null;const i=MES.indexOf(m[2].toLowerCase());if(i<0)return null;return Date.UTC(m[3]?+m[3]:new Date().getFullYear(),i,+m[1])};
function colFecha(t,c){const n=t.tHead.rows[0].cells.length,vals=[...t.tBodies[0].rows].filter(r=>r.cells.length===n).map(r=>textoCelda(r,c)).filter(v=>!vacio(v));
  return vals.length>0&&vals.every(v=>fechaCelda(v)!==null)}
function aplicarOrdenes(){
  tablasOrdenables().forEach(t=>{
    const tb=t.tBodies[0],filas=[...tb.rows],k=ordKey(t),ord0=ORDEN[k],col=ord0?ord0.c:undefined,sent=ord0&&ord0.dir==='desc'?-1:1;
    filas.forEach((r,i)=>{if(!('oi' in r.dataset))r.dataset.oi=i});
    const ths=t.tHead?[...t.tHead.rows[0].cells]:[];
    const anchos=ANCHOS[k]||{};let fijo=false;
    ths.forEach((th,i)=>{if(th.textContent.trim()){th.tabIndex=0;th.style.cursor='pointer';th.setAttribute('aria-sort',col===i?(sent<0?'descending':'ascending'):'none');th.classList.toggle('ord',col===i)}
      if(!th.querySelector('.rz')){const h=document.createElement('span');h.className='rz';h.setAttribute('aria-hidden','true');th.appendChild(h)}

    t.classList.toggle('fijo',fijo);

    else{ord=filas.slice().sort((a,b)=>{const x=textoCelda(a,col),y=textoCelda(b,col);
      if(vacio(x)||vacio(y))return vacio(x)-vacio(y);// los vacíos siempre al final
      const dx=fechaCelda(x),dy=fechaCelda(y);if(dx!==null&&dy!==null)return sent*(dx-dy);

  const items = [];

  if (d.nivel === 'bajo') items.push(['Esta quincena hubo pocos escaneos', 'Pasa al inicio y se mejora con ajustes sencillos.']);
  else if (d.nivel === 'alto') items.push(['Gran quincena: ' + tot + ' escaneos', 'Cada escaneo es una oportunidad de reseña. Mantén el ritmo.']);
  else if (c.pct_finde >= 50) items.push(['Fin de semana: ' + c.pct_finde + '% de tus escaneos', 'Entre semana hay reseñas por ganar.']);
  else items.push(['Entre semana: ' + (100 - c.pct_finde) + '% de tus escaneos', 'El fin de semana hay reseñas por ganar.']);
  // 2. Comparación
  if (d.promedio_red != null) {
    const arriba = tot >= d.promedio_red;
    items.push([arriba ? 'Vas arriba del promedio' : 'Vas por debajo del promedio', 'Los negocios con display Bien Visto promedian ' + d.promedio_red + ' escaneos por quincena.']);
  } else if (d.anterior == null) items.push(['Este es tu punto de partida', 'Desde aquí medimos cuánto crece tu display quincena a quincena.']);
  else if (tot > d.anterior) items.push(['Subiste ' + (tot - d.anterior) + ' escaneos', 'La quincena anterior fueron ' + d.anterior + '. Sigue así.']);
  else items.push(['Quincena anterior: ' + d.anterior + ' escaneos', 'Esta quincena: ' + tot + '. La constancia importa más que un pico.']);
  // 3. Qué hacer
  if (n === 6) items.push(['Cerraste tus 90 días de seguimiento', 'Sumaron ' + d.acumulado + ' escaneos. El siguiente paso es convertirlos en más reseñas.']);
  else items.push(['Haz esto esta quincena', d.rec ? d.rec.texto : 'Pide la reseña al cobrar y señala el display.']);
  return items;
}

async function dibujarResumen(d, opciones) {

  x.fillStyle = BV.c; x.fillRect(0, 0, W, H0);

  font(800, 56); let nombre = d.negocio || 'Tu negocio'; while (x.measureText(nombre).width > 968 && nombre.length > 4) nombre = nombre.slice(0, -2);
  if (nombre !== (d.negocio || 'Tu negocio')) nombre += '…';
  txt(nombre, 56, 175, BV.v, 800, 56);
  txt(d.numero === 6 ? 'Así te fue en tus 90 días con el display' : 'Así se usó tu display esta quincena', 56, 214, BV.g, 400, 26);

  let y = 258;

  const c = d.cifras, tw = [376, 278, 278], gx = [56, 56 + 376 + 18, 56 + 376 + 18 + 278 + 18];
  const tile = (i, big, num, numSize, label, pill) => {
    const w = tw[i], h = 200; rr(gx[i], y, w, h, 24); x.fillStyle = big ? BV.v : '#fff'; x.fill(); if (!big) { x.lineWidth = 2; x.strokeStyle = BV.l; x.stroke(); }
    txt(num, gx[i] + 24, y + (numSize === 58 ? 70 : 64), big ? '#fff' : BV.t, 800, numSize);
    font(400, 23); const ls = wrap(label, w - 48); ls.slice(0, 2).forEach((l, k) => txt(l, gx[i] + 24, y + 104 + k * 27, big ? '#CFE5DF' : BV.g, 400, 23));

  };
  const diasConEsc = c.por_dia.filter((p) => p.n > 0).length;
  const prevPill = d.anterior == null ? null : (c.total >= d.anterior ? '▲ ' + (c.total - d.anterior) + ' más que antes' : '▼ ' + (d.anterior - c.total) + ' menos que antes');
  if (d.numero === 6) {
    tile(0, true, String(d.acumulado), 58, 'escaneos en tus 90 días', null);

  } else tile(0, true, String(c.total), 58, c.total === 1 ? 'persona escaneó tu display' : 'personas escanearon tu display', prevPill);

    tile(2, false, c.mejor_franja ? c.mejor_franja.desde.replace(' am', '').replace(' pm', '') + ' a ' + c.mejor_franja.hasta : '-', 40, 'tu mejor hora', c.mejor_franja ? c.mejor_franja.pct + '% del total' : null);
  }
  y += 200 + 36;
  // Gráfica
  const bajo = d.nivel === 'bajo' && d.numero !== 6;

    } else {
      const base = y + 196, bh = Math.max(p.n ? 8 : 0, Math.round((p.n / maxN) * 130));
      const color = i === mejorIdx ? BV.a : (dow === 0 || dow === 6) ? BV.v : BV.claro;
      if (bh) { x.beginPath(); x.moveTo(cx - 20, base); x.lineTo(cx - 20, base - bh + 9); x.arcTo(cx - 20, base - bh, cx - 11, base - bh, 9); x.lineTo(cx + 11, base - bh); x.arcTo(cx + 20, base - bh, cx + 20, base - bh + 9, 9); x.lineTo(cx + 20, base); x.closePath(); x.fillStyle = color; x.fill(); }
      txt(String(p.n), cx, base - bh - 7, BV.t, 600, 20, 'center'); txt(String(dnum), cx, base + 26, BV.t, 600, 20, 'center'); txt(INICIALES[dow], cx, base + 46, BV.g, 400, 17, 'center');
    }
  });
  // Leyenda
  const leyenda = bajo ? [[BV.v, 'Día con escaneos'], ['#fff', 'Sin escaneos']] : [[BV.a, 'Tu mejor día'], [BV.v, 'Fin de semana'], [BV.claro, 'Entre semana']];
  let lx = 80; const ly = y + chartH - 18;
  leyenda.forEach(([col, t]) => { rr(lx, ly - 14, 16, 16, 4); x.fillStyle = col; x.fill(); if (col === '#fff') { x.lineWidth = 2; x.strokeStyle = '#C9D8D2'; x.stroke(); } txt(t, lx + 24, ly + 1, BV.g, 400, 21); font(400, 21); lx += 24 + x.measureText(t).width + 26; });
  y += chartH + 30;
  // Lo que vemos
  txt('Lo que vemos', 56, y + 18, BV.t, 600, 32); y += 40;
  textoResumen(d).forEach(([t, s], i) => {
    font(400, 22); const ls = wrap(s, 800); const h = 24 + 30 + ls.length * 29 + 12;
    rr(56, y, 968, h, 20); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 2; x.strokeStyle = BV.l; x.stroke();
    x.beginPath(); x.arc(56 + 20 + 22, y + 24 + 22 - 6, 22, 0, Math.PI * 2); x.fillStyle = BV.m; x.fill(); txt(String(i + 1), 98, y + 49, BV.v, 800, 26, 'center');
    txt(t, 138, y + 40, BV.t, 600, 26); ls.forEach((l, k) => txt(l, 138, y + 72 + k * 29, BV.g, 400, 22));
    y += h + 12;
  });
  // Pie
  y += 22; const fy = y, fh = 232;

  const titulo = d.numero === 6 ? 'Sigamos con un plan a tu medida' : d.nivel === 'bajo' ? '¿Quieres que tu display rinda más?' : '¿Quieres más reseñas y más clientes?';
  txt(titulo, 56, fy + 56, '#fff', 800, 34);
  const cuerpo = d.numero === 6 ? 'Revisamos tu perfil de Google contigo y armamos un plan para seguir sumando reseñas. Escríbenos y te contamos las opciones.' : 'Revisamos tu perfil de Google contigo y armamos un plan a tu medida. Hay un plan de arranque con precio accesible.';
  font(400, 23); wrap(cuerpo, 968).forEach((l, k) => txt(l, 56, fy + 92 + k * 30, '#DCEDE8', 400, 23));
  rr(56, fy + 150, 395, 62, 31); x.fillStyle = BV.a; x.fill(); txt('Escríbenos: 220 143 5851', 82, fy + 191, BV.t, 800, 28);
  const prox = d.numero === 6 ? ['Fin de tu seguimiento de 90 días', 'Gracias por usar Bien Visto'] : ['Próximo resumen: ' + (opciones.proximo ? fechaLarga(opciones.proximo) : 'en 15 días'), 'Resumen ' + d.numero + ' de 6 de tu seguimiento'];
  txt(prox[0], 1024, fy + 166, '#CFE5DF', 400, 22, 'right'); txt(prox[1], 1024, fy + 196, '#CFE5DF', 400, 22, 'right');
  const H = fy + fh + 8;
  const out = document.createElement('canvas'); out.width = W; out.height = H; out.getContext('2d').drawImage(cv, 0, 0);
  return out;
}

/* ===== seguimiento: resúmenes quincenales por WhatsApp ===== */
const SEG={d:null,cv:{},conf:null};
const SEG_SALUDO='¡Hola! 👋 Soy Israel de Bien Visto. Activamos tu display. Cada 15 días te mandaré por aquí un resumen corto de cómo se está usando 📊. Responde SÍ para recibirlo.';
const segSumar=(dia,n)=>{const d=new Date(dia+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const segNombre=c=>String(c||'').trim().split(/\s+/)[0]||'';
const segWa=(tel,texto)=>tel?'https://wa.me/'+tel+'?text='+encodeURIComponent(texto):'';
const segMensaje=r=>{const n=segNombre(r.contacto);const hola=n?'Hola '+n+', ':'Hola, ';return r.numero===6?hola+'este es el resumen de cierre de tus 90 días con Bien Visto. Si quieres seguir con un plan a tu medida, respóndeme por aquí.':hola+'te comparto el resumen '+r.numero+' de 6 de tu display. Si quieres que revisemos juntos tu perfil de Google, respóndeme por aquí.'};
R.seg=()=>{$('#main').innerHTML=head()+'<div id="segCuerpo"><p class="sub">Cargando…</p></div>';segCargar()};
async function segCargar(){try{SEG.d=await apiJson('/api/seguimiento/hoy','GET');if(S.vista==='seg')pintarSeg()}catch(e){const c=$('#segCuerpo');if(c)c.innerHTML='<div class="card"><p class="sub">No se pudo cargar el seguimiento: '+esc(e.message||'error')+'</p></div>'}}
function pintarSeg(){const d=SEG.d,c=$('#segCuerpo');if(!d||!c)return;SEG.cv={};
 const nivelChip=n=>`<span class="chip ${n==='bajo'?'c-a':'c-v'}">Actividad ${n}</span>`;
 const btn=(a,v,n,t,cls)=>`<button class="btn ${cls||'s'} sm" data-sa="${a}" data-v="${esc(v)}" ${n?`data-n="${n}"`:''}>${t}</button>`;
 const env=d.envios.map(r=>{const k=r.venta_id+'-'+r.numero;const wa=segWa(r.whatsapp,segMensaje(r));
  return `<div class="card" style="margin:0 0 14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px"><h2 style="font-size:19px;margin:0">${esc(r.negocio||'Sin nombre')}</h2><span class="chip c-g">Resumen ${r.numero} de 6</span>${nivelChip(r.nivel)}</div>
  <p class="sub" style="margin:0 0 10px">${esc(r.contacto||'')}${r.whatsapp?' · '+esc(r.whatsapp.slice(2)):' · sin WhatsApp válido'} · ${r.cifras.total} escaneos del ${esc(r.periodo.desde)} al ${esc(r.periodo.hasta)}${r.respondio?'':' · aún no responde SÍ'}</p>
  <div class="seg-prev" id="prev-${esc(k)}" style="margin:0 0 12px;min-height:80px"><p class="sub">Generando imagen…</p></div>
  <ol class="sub" style="margin:0 0 12px;padding-left:20px"><li>Copia la imagen.</li><li>Abre el chat de WhatsApp.</li><li>Pega la imagen y envía.</li></ol>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${btn('copiar',r.venta_id,r.numero,'Copiar imagen','p')}${btn('bajar',r.venta_id,r.numero,'Descargar PNG')}${wa?`<a class="btn s sm" style="text-decoration:none;color:var(--tinta)" href="${esc(wa)}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:''}${btn('enviado',r.venta_id,r.numero,'Marcar enviado','a')}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${r.respondio?'':btn('respondio',r.venta_id,0,'Respondió SÍ')}${btn('omitir',r.venta_id,r.numero,'Omitir este resumen')}${btn('baja',r.venta_id,0,'Dar de baja','d')}</div></div>`}).join('');
 const sal=d.saludos.map(r=>{const wa=segWa(r.whatsapp,SEG_SALUDO);return `<div class="card" style="margin:0 0 14px"><h2 style="font-size:19px;margin:0 0 4px">${esc(r.negocio||'Sin nombre')}</h2><p class="sub" style="margin:0 0 8px">${esc(r.contacto||'')}${r.whatsapp?' · '+esc(r.whatsapp.slice(2)):' · sin WhatsApp válido'}</p><p style="margin:0 0 10px;max-width:70ch">${esc(SEG_SALUDO)}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${wa?`<a class="btn p sm" style="text-decoration:none;color:var(--crema)" href="${esc(wa)}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:''}${btn('saludo',r.venta_id,0,'Marcar enviado','a')}${btn('baja',r.venta_id,0,'Dar de baja','d')}</div></div>`}).join('');
 const sin=d.sin_consentimiento.map(r=>`<div class="card" style="margin:0 0 14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div><h2 style="font-size:19px;margin:0">${esc(r.negocio||'Sin nombre')}</h2><p class="sub" style="margin:2px 0 0">${esc(r.contacto||'')} · activó el ${esc(r.inicio)}</p></div>${btn('consentimiento',r.venta_id,0,'Registrar consentimiento')}</div></div>`).join('');
 const vacio=!d.envios.length&&!d.saludos.length&&!d.sin_consentimiento.length;
 c.innerHTML=(d.activo?'':'<div class="banner"><span>El seguimiento está apagado: las ventas nuevas no entran al calendario.</span></div>')+
  `<p class="sub" style="max-width:70ch;margin:0 0 14px">Cada 15 días, durante 90 días, a cada cliente con consentimiento le toca un resumen de su display. Niveles por display: bajo menos de ${d.umbrales.bajo} escaneos, alto desde ${d.umbrales.alto}.</p>`+
  (vacio?'<div class="card"><h2 style="font-size:19px">Hoy no hay nada por enviar</h2><p class="sub">Los resúmenes aparecen aquí el día que les toca, 15 días después de activar cada display.</p></div>':'')+
  (d.envios.length?`<h2 style="font-size:20px;margin:6px 0 10px">Resúmenes de hoy (${d.envios.length})</h2>${env}`:'')+
  (d.saludos.length?`<h2 style="font-size:20px;margin:6px 0 10px">Saludos por enviar (${d.saludos.length})</h2>${sal}`:'')+
  (d.sin_consentimiento.length?`<h2 style="font-size:20px;margin:6px 0 4px">Sin consentimiento registrado (${d.sin_consentimiento.length})</h2><p class="sub" style="margin:0 0 10px;max-width:70ch">No se les manda nada hasta registrar que aceptaron recibir los resúmenes.</p>${sin}`:'');
 d.envios.forEach(r=>{const k=r.venta_id+'-'+r.numero;dibujarResumen(r,{proximo:r.numero<6?segSumar(r.programado_para,15):null}).then(cv=>{SEG.cv[k]=cv;const h=document.getElementById('prev-'+k);if(h){cv.style.cssText='width:100%;max-width:360px;height:auto;border-radius:12px;border:1px solid var(--borde);display:block';h.textContent='';h.appendChild(cv)}}).catch(()=>{const h=document.getElementById('prev-'+k);if(h)h.innerHTML='<p class="sub">No se pudo generar la imagen.</p>'})})}
function segBlob(k){return new Promise((ok,no)=>{const cv=SEG.cv[k];if(!cv)return no(new Error('La imagen aún no está lista'));cv.toBlob(b=>b?ok(b):no(new Error('No se pudo crear la imagen')),'image/png')})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-sa]');if(!b||S.vista!=='seg')return;
 const a=b.dataset.sa,v=b.dataset.v,n=Number(b.dataset.n||0),k=v+'-'+n;
 try{
  if(a==='copiar'){const bl=await segBlob(k);if(!(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem)){toast('Tu navegador no permite copiar la imagen. Usa Descargar PNG.');return}await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]);toast('Imagen copiada. Pégala en el chat de WhatsApp.');return}
  if(a==='bajar'){const bl=await segBlob(k);const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='resumen-'+n+'-'+v+'.png';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
  const peligro=a==='baja'||a==='omitir'||a==='enviado';
  if(peligro&&SEG.conf!==a+k){SEG.conf=a+k;const t=b.textContent;b.textContent=a==='enviado'?'¿Ya lo enviaste? Confirma':'Confirma';setTimeout(()=>{if(b.isConnected){b.textContent=t}if(SEG.conf===a+k)SEG.conf=null},4000);return}
  SEG.conf=null;
  const url=a==='enviado'||a==='omitir'?`/api/seguimiento/${encodeURIComponent(v)}/envio/${n}/${a}`:`/api/seguimiento/${encodeURIComponent(v)}/${a}`;
  await apiJson(url,'POST');toast({enviado:'Resumen marcado como enviado',omitir:'Resumen omitido',baja:'Cliente dado de baja',saludo:'Saludo marcado como enviado',respondio:'Anotado: respondió SÍ',consentimiento:'Consentimiento registrado'}[a]||'Listo');await segCargar();
 }catch(err){toast('No se pudo: '+(err.message||'error'))}});
})();
