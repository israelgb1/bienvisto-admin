/* Mockup de marca: apariencia clara por decisión (identidad Bien Visto). Layout: barra lateral verde + área de trabajo crema; en móvil, barra inferior. */
:root{color-scheme:light;--verde:#0E6B5C;--verde-h:#0A5246;--ambar:#F2A71B;--tinta:#12302B;--crema:#FBF6EC;--menta:#E7F0EC;--blanco:#fff;--muted:#3F544E;--borde:#CFDDD6;--borde-s:#6B897E;--ambar-t:#8A5A00;--danger:#B3261E;--danger-bg:#FDF4F3;--fd:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:400 16px/1.5 var(--fb);color:var(--tinta);background:var(--crema)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
[hidden]{display:none!important}
.show-m{display:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--verde);color:var(--crema);padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:44px;height:auto;flex:none}
.brand b{font:600 18px/1 var(--fd)}.brand small{display:block;font-size:12px;opacity:.8;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15.5px;text-align:left;min-height:44px}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:rgba(251,246,236,.12)}
.nav button[aria-current=page]{background:var(--crema);color:var(--verde)}
.side .foot{margin-top:auto;font-size:13px;opacity:.85;padding:0 8px}
main{padding:24px 32px 64px;min-width:0;max-width:1360px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:20px}
.top h1{font-size:34px;flex:1;min-width:200px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who select{width:auto;min-height:44px;padding:8px 36px 8px 14px;font-size:15px;font-weight:600;border-radius:999px;border:2px solid var(--borde-s);background:#fff;color:var(--tinta)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--menta);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:16px}
.banner.warn{background:#FCEFD3}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner button{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--verde);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px}
.kpi b{display:block;font:600 34px/1 var(--fd);color:var(--verde);font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted);display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:18px;min-width:0}
.card h2{font-size:20px;font-weight:500;margin-bottom:2px}
.card .sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.btn{font:600 16px/20px var(--fb);min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--verde);color:var(--crema)}.btn.p:hover{background:var(--verde-h)}
.btn.a{background:var(--ambar);color:var(--tinta)}
.btn.s{border-color:var(--borde-s);background:transparent}.btn.s:hover{background:var(--menta)}
.btn.d{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-v{background:#DDEFE8;color:var(--verde)}.c-a{background:#FCE3AE;color:var(--ambar-t)}.c-g{background:#E9ECEB;color:var(--muted)}.c-r{background:#F7E3E1;color:var(--danger)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:14px;background:var(--verde);border-radius:0 7px 7px 0;min-width:3px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.bar.dim i{background:var(--borde-s)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:none}
.chart .ro{font-size:14px;font-weight:600;min-height:22px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.chart text{font:12px var(--fb);fill:var(--muted)}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar input[type=search],.tbar select,input.f,select.f,textarea.f{font:400 16px/22px var(--fb);min-height:44px;padding:8px 14px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta);width:100%}
.tbar input[type=search]{flex:1;min-width:180px;width:auto}
.tbar select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--borde);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font:600 12.5px/1.2 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:var(--menta);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--borde);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#F6FAF8}
td .n{font-weight:600;line-height:1.25}td .m{font-size:13px;color:var(--muted);line-height:1.3}
.folio{font:600 18px/1 var(--fd);letter-spacing:.08em;color:var(--verde)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--tinta);font:500 19px/1.2 var(--fd);margin-bottom:4px}
.sel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--tinta);color:var(--crema);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.sel select{width:auto;min-height:40px;padding:6px 12px;border-radius:999px;font-weight:600}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--verde)}
.ov{position:fixed;inset:0;background:rgba(18,48,43,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.right{justify-content:flex-end;padding:0;align-items:stretch}
.dlg{background:var(--crema);border-radius:24px;padding:24px;width:min(480px,100%);max-height:calc(100% - 16px);overflow-y:auto}
.ov.right .dlg{border-radius:24px 0 0 24px;width:min(460px,100%);max-height:none}
.dlg h2{font-size:24px;margin-bottom:6px}.dlg .sub{font-size:14.5px;color:var(--muted);margin-bottom:14px}
.fld{margin-bottom:12px}
.lbl{display:block;font:600 13px/16px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input.f[aria-invalid=true]{border-color:var(--danger);background:var(--danger-bg)}
.err{display:flex;gap:6px;color:var(--danger);font-size:14px;font-weight:600;margin-top:6px;line-height:1.35}
.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.step{background:var(--menta);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0}
.step code{background:#fff;border-radius:6px;padding:1px 6px;font-size:13.5px;word-break:break-all}
.log{list-style:none;padding:0}.log li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--borde);font-size:14.5px}
.log li:first-child{border:0}.log time{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tinta);color:var(--crema);padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;transition:.2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;margin:12px 0}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.mini{display:flex;flex-direction:column}.mini button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 0;border-top:1px solid var(--borde);min-height:52px}.mini button:first-child{border:0}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){

 .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:0;border-top:1px solid var(--verde-h)}
 .brand,.side .foot{display:none}

 .hide-m{display:none}.show-m{display:block}
 td,th{padding:10px 8px}.acts .btn{padding:8px 10px;font-size:13.5px;min-height:40px}.acts{flex-direction:column;align-items:stretch}

 .bar{grid-template-columns:90px minmax(0,1fr) 30px}
 .toast{bottom:84px}
 .who{width:100%}.who select{flex:1}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

function chart(){const W=640,H=200,L=34,B=26,T=10,R_=12;const mx=Math.ceil(Math.max(...SC)/50)*50;const x=i=>L+i*(W-L-R_)/29,y=v=>T+(H-T-B)*(1-v/mx);
 const pts=SC.map((v,i)=>[x(i),y(v)]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');

function wireChart(){const h=$('#hit');if(!h)return;const W=640,H=200,L=34,B=26,T=10,R_=12;const mx=Math.ceil(Math.max(...SC)/50)*50;
 const mv=e=>{const r=h.getBoundingClientRect();const px=(e.clientX-r.left)/r.width;const i=Math.max(0,Math.min(29,Math.round(px*29)));const xx=L+i*(W-L-R_)/29,yy=T+(H-T-B)*(1-SC[i]/mx);

function bpagDlg(i){const r=BONO_PREV[i],v=V.find(x=>x.id===r.v);
 const o=ov(`<h2>Pagar bono de ${r.mes.toLowerCase()}</h2><p class="sub">${esc(v.n)} · ${r.n} displays entregados · <b>${mxn(r.b)}</b></p>
 ${v.cu?`<div class="step"><b>Transfiere a</b><dl class="dl" style="margin:8px 0 0"><dt>Titular</dt><dd>${esc(v.cu.titular)}</dd><dt>Banco</dt><dd>${bancoDe(v.cu.clabe)} · ${v.cu.tipo}</dd><dt>CLABE</dt><dd>${fmtClabe(v.cu.clabe)}</dd></dl></div>`:`<p class="err">${ERR}<span>${esc(v.n)} no ha cargado su cuenta. Pídele que la cargue antes de pagar.</span></p>`}
 <div class="fld"><label class="lbl" for="bpr">Clave de rastreo de la transferencia</label><input class="f" id="bpr" autocapitalize="characters" autocomplete="off" aria-describedby="bpr-e"><div id="bpr-e"></div></div>
 <div class="row2"><button class="btn p" id="bpok" ${v.cu?'':'disabled'}>Marcar como pagado</button><button class="btn s" data-x>Cancelar</button></div>`);
 o.querySelector('#bpr').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/\s/g,'');showErr(o,'bpr','')};
 o.querySelector('#bpok').onclick=()=>{const x=o.querySelector('#bpr').value,m=errRef(x);if(m){showErr(o,'bpr',m);o.querySelector('#bpr').focus();return}
  r.pag='2026-10-06';r.ref=x;log('Pagó el bono de '+r.mes.toLowerCase()+' a '+v.n+': '+mxn(r.b)+' ('+x+')');cerrar();render();toast('Bono de '+v.n.split(' ')[0]+' marcado como pagado')}}
function bmetaDlg(){const o=ov(`<h2>Editar metas del bono</h2><p class="sub">Aplican a las entregas que confirmes desde hoy. Los vendedores las ven al instante en su panel. Cada meta debe pedir más displays y pagar más que la anterior.</p>
 ${BONOS.map((x,i)=>`<div class="row2" style="align-items:flex-start;gap:10px"><div class="fld" style="flex:1"><label class="lbl" for="bn${i}">Meta ${i+1}: displays entregados</label><input class="f" id="bn${i}" inputmode="numeric" value="${x.n}" aria-describedby="bn${i}-e"><div id="bn${i}-e"></div></div><div class="fld" style="flex:1"><label class="lbl" for="bb${i}">Bono ($)</label><input class="f" id="bb${i}" inputmode="numeric" value="${x.b}" aria-describedby="bb${i}-e"><div id="bb${i}-e"></div></div></div>`).join('')}
 <div class="step" id="bpv" aria-live="polite"></div><div class="row2"><button class="btn p" id="bmg">Guardar metas</button><button class="btn s" data-x>Cancelar</button></div>`);
 const val=()=>{const L=BONOS.map((_,i)=>[o.querySelector('#bn'+i).value.trim(),o.querySelector('#bb'+i).value.trim()]);const er=[];
  L.forEach(([n,b],i)=>{let en='',eb='';if(!/^\d+$/.test(n)||+n<1)en='Escribe un número entero de displays, mayor a 0.';else if(i&&+n<=+L[i-1][0]&&/^\d+$/.test(L[i-1][0]))en='Debe ser mayor que la meta anterior ('+L[i-1][0]+').';
   if(!/^\d+$/.test(b)||+b<1)eb='Escribe un monto entero en pesos.';else if(i&&+b<=+L[i-1][1]&&/^\d+$/.test(L[i-1][1]))eb='Debe pagar más que la meta anterior ('+mxn(+L[i-1][1])+').';er.push([en,eb])});return {L,er}};
 const prev=()=>{const {L,er}=val(),b=o.querySelector('#bpv');if(er.some(e=>e[0]||e[1])){b.textContent='Corrige las metas para ver cuánto te cuesta cada una.';return}b.innerHTML=L.map(([n,v])=>{const pc=Math.round(+v/(+n*margenDisp())*100);return 'Meta de '+n+': el bono se lleva <b>'+pc+'%</b> de los '+mxn(+n*margenDisp())+' que te dejan esos displays.'}).join('<br>')};
 o.querySelectorAll('input').forEach(i=>i.oninput=()=>{prev()});prev();
 o.querySelector('#bmg').onclick=()=>{const {L,er}=val();BONOS.forEach((_,i)=>{showErr(o,'bn'+i,er[i][0]);showErr(o,'bb'+i,er[i][1])});const bad=er.findIndex(e=>e[0]||e[1]);if(bad>=0){o.querySelector(er[bad][0]?'#bn'+bad:'#bb'+bad).focus();return}
  if(L.every(([n,b],i)=>+n===BONOS[i].n&&+b===BONOS[i].b)){showErr(o,'bn0','No cambiaste nada. Modifica alguna meta o su bono.');return}
  BONOS=L.map(([n,b])=>({n:+n,b:+b}));log('Cambió las metas del bono mensual a '+BONOS.map(x=>x.n+' = '+mxn(x.b)).join(', '));cerrar();render();toast('Metas actualizadas')}}
function cobPrecios(){const k=calc(PR.p,PR.c,PR.costo,PR.isr);
 $('#sub').innerHTML=`<div class="grid2"><div class="card"><h2>Precio vigente</h2><p class="sub">Fijo para todos los vendedores. Solo tú lo puedes cambiar.</p>
 <div class="split3"><div><b>${mxn(PR.p)}</b><span>paga el cliente (IVA incluido)</span></div><div class="me"><b>${mxn(PR.c)}</b><span>comisión del vendedor</span></div><div><b>${mxn(PR.p-PR.c)}</b><span>el vendedor entrega</span></div></div>
 <dl class="dl"><dt>IVA incluido</dt><dd>${mxn(Math.round(k.iva*100)/100)}</dd><dt>Base sin IVA</dt><dd>${mxn(Math.round(k.base*100)/100)}</dd><dt>Vigente desde</dt><dd>${fmt(PH[0].f)}</dd></dl>
 <div class="card" style="background:#FFF3D6;border-color:var(--ambar);margin:12px 0"><h3 style="margin:0 0 4px;font-size:18px">Promoción: ${PR.pn} displays por ${mxn(PR.pp)}</h3><p class="sub" style="margin:0 0 6px">En la misma venta, de cualquier tipo de display. El vendedor conserva ${mxn(PR.c)} por display (${mxn(PR.pn*PR.c)}) y entrega ${mxn(PR.pp-PR.pn*PR.c)}. El descuento de ${mxn(PR.pn*PR.p-PR.pp)} lo absorbes tú.</p><p class="sub" style="margin:0">Tu utilidad estimada por display: <b>${mxn(Math.round(calc(PR.pp/PR.pn,PR.c,PR.costo,PR.isr).ut*100)/100)}</b> en promoción, contra ${mxn(Math.round(k.ut*100)/100)} sin ella.</p></div>
 <button class="btn p" data-precio>Cambiar precio o comisión</button> <button class="btn s" data-gocfg>Editar promoción y demás reglas</button><p class="sub" style="margin:10px 0 0">El cambio aplica a ventas nuevas. Los recibos ya enviados conservan el precio con el que se vendieron.</p></div>
 <div class="card"><h2>Tu utilidad por display</h2><p class="sub">Después de IVA, costo, comisión e ISR.</p>
 <div class="fld"><label class="lbl" for="pc">Costo de producción</label><input class="f" id="pc" type="number" min="0" step="1" value="${PR.costo}"></div>
 <div class="fld"><label class="lbl" for="pi">Tasa de ISR (RESICO, sobre ingreso sin IVA)</label><select class="f" id="pi">${[1,1.1,1.5,2,2.5].map(r=>`<option value="${r}" ${PR.isr===r?'selected':''}>${r}%</option>`).join('')}</select></div>
 <table class="calc"><tbody><tr><td>Precio al cliente</td><td>${mxn(PR.p)}</td></tr><tr><td>IVA incluido</td><td>−${mxn(Math.round(k.iva*100)/100)}</td></tr><tr><td>Costo de producción</td><td>−${mxn(PR.costo)}</td></tr><tr><td>Comisión del vendedor (sin factura, no deducible)</td><td>−${mxn(PR.c)}</td></tr><tr><td>ISR</td><td>−${mxn(Math.round(k.im*100)/100)}</td></tr><tr class="t"><td>Te queda</td><td>${mxn(Math.round(k.ut*100)/100)}</td></tr></tbody></table>
 <p class="sub" style="margin:10px 0 0">Estimación; las tasas y deducciones las confirma tu contador.</p></div></div>
 <h2 style="font-size:20px;font-weight:500;margin:20px 0 8px">Historial de precios</h2><div class="tw"><table><thead><tr><th>Desde</th><th class="num">Precio</th><th class="num">Comisión</th><th class="num">Entrega</th><th>Quién</th><th class="hide-m">Nota</th></tr></thead><tbody>${PH.map(h=>`<tr><td>${fmt(h.f)}</td><td class="num">${mxn(h.p)}</td><td class="num">${mxn(h.c)}</td><td class="num">${mxn(h.p-h.c)}</td><td>${esc(h.q)}</td><td class="hide-m">${esc(h.n)}</td></tr>`).join('')}</tbody></table></div>`;
 $('#pc').oninput=e=>{const v=parseFloat(e.target.value);PR.costo=isNaN(v)||v<0?0:v;cobPrecios();const i=$('#pc');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
 $('#pi').onchange=e=>{PR.isr=parseFloat(e.target.value);cobPrecios()}}

function precioDlg(){const o=ov(`<h2>Cambiar precio o comisión</h2><p class="sub">Aplica a ventas nuevas. Los vendedores ven el cambio en su panel al instante.</p>
 <div class="fld"><label class="lbl" for="np">Precio al cliente (IVA incluido)</label><input class="f" id="np" inputmode="numeric" value="${PR.p}" aria-describedby="np-e"><div id="np-e"></div></div>
 <div class="fld"><label class="lbl" for="nc">Comisión del vendedor</label><input class="f" id="nc" inputmode="numeric" value="${PR.c}" aria-describedby="nc-e"><div id="nc-e"></div></div>
 <div class="step" id="npv" aria-live="polite"></div>
 <div class="row2"><button class="btn p" id="ng">Guardar</button><button class="btn s" data-x>Cancelar</button></div>`);
 const eP=v=>{v=v.trim();if(!v)return'Escribe el precio al cliente.';if(!/^\d+$/.test(v))return'Usa solo números enteros, sin $ ni centavos.';if(+v<1)return'El precio debe ser mayor a cero.';return''};
 const eC=(v,p)=>{v=v.trim();if(!v)return'Escribe la comisión del vendedor.';if(!/^\d+$/.test(v))return'Usa solo números enteros, sin $ ni centavos.';if(!/^\d+$/.test(p)||+v>=+p)return'La comisión debe ser menor al precio'+(/^\d+$/.test(p)?' ('+mxn(+p)+')':'')+'.';return''};
 const prev=()=>{const p=o.querySelector('#np').value.trim(),c=o.querySelector('#nc').value.trim(),b=o.querySelector('#npv');if(eP(p)||eC(c,p)){b.textContent='Completa los dos datos para ver cuánto entrega el vendedor y cuánto te queda.';return}
  const k=calc(+p,+c,PR.costo,PR.isr);b.innerHTML=`El vendedor entrega <b>${mxn(+p-+c)}</b> por display. Tu utilidad estimada: <b>${mxn(Math.round(k.ut*100)/100)}</b>${k.ut<0?' (negativa)':''}.`};
 const sh={p:false,c:false};
 o.querySelector('#np').oninput=()=>{if(sh.p)showErr(o,'np',eP(o.querySelector('#np').value));if(sh.c)showErr(o,'nc',eC(o.querySelector('#nc').value,o.querySelector('#np').value.trim()));prev()};
 o.querySelector('#nc').oninput=()=>{if(sh.c)showErr(o,'nc',eC(o.querySelector('#nc').value,o.querySelector('#np').value.trim()));prev()};
 o.querySelector('#np').onblur=()=>{sh.p=true;showErr(o,'np',eP(o.querySelector('#np').value))};o.querySelector('#nc').onblur=()=>{sh.c=true;showErr(o,'nc',eC(o.querySelector('#nc').value,o.querySelector('#np').value.trim()))};
 o.querySelector('#ng').onclick=()=>{const p=o.querySelector('#np').value.trim(),c=o.querySelector('#nc').value.trim(),a=eP(p),b=eC(c,p);showErr(o,'np',a);showErr(o,'nc',b);if(a||b){o.querySelector(a?'#np':'#nc').focus();return}
  if(+p===PR.p&&+c===PR.c){showErr(o,'np','No cambiaste nada. Modifica el precio o la comisión.');return}
  PH.unshift({f:'2026-10-06',p:+p,c:+c,q:yo().n,n:'Cambio de precio'});PR.p=+p;PR.c=+c;log('Cambió el precio a '+mxn(+p)+' y la comisión a '+mxn(+c));cerrar();render();toast('Precio actualizado. Aplica a ventas nuevas')};prev()}

;border:2px solid var(--borde-s);font-weight:600;font-size:14px;background:#fff}\n.jump button[aria-pressed=true]{background:var(--verde);color:var(--crema);border-color:var(--verde)}\n.notes{display:grid;gap:12px}\n.note{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px 18px}\n.note h3{font-size:18px;font-weight:500;margin-bottom:4px}\n.note p{font-size:14.5px;line-height:1.5}\n.note code{background:var(--menta);padding:1px 6px;border-radius:6px;font-size:13px}\n.meter{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}\n.meter b{font:600 22px/1 var(--fd);color:var(--verde);display:block}\n.meter span{font-size:12.5px;color:var(--muted)}\n.meter div{background:var(--menta);border-radius:12px;padding:10px 14px}\n\n/* teléfono */\n.device{width:372px;max-width:100%;height:800px;background:#fff;border:10px solid var(--tinta);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(18,48,43,.22);margin:0 auto;position:sticky;top:20px}\n.phone{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--crema);overflow:hidden}\n.sb{flex:none;height:34px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font:600 13px/1 var(--fb);color:var(--tinta);position:relative;z-index:9;pointer-events:none}\n.device.pwa .sb{background:var(--crema)}\n.chrome{flex:none;display:flex;align-items:center;gap:10px;padding:5px 12px 7px;background:#fff;border-bottom:1px solid #DADCE0;color:#3C4043}\n.device.pwa .chrome{display:none}\n.omni{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:#F1F3F4;border-radius:999px;height:38px;padding:0 14px;font-size:14px}\n.omni svg{width:15px;height:15px;flex:none;fill:none;stroke:#5F6368;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.omni span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.tabn{width:24px;height:24px;border:2px solid #5F6368;border-radius:6px;display:grid;place-items:center;font:600 12px/1 var(--fb);color:#5F6368;flex:none}\n.chrome .dots{width:22px;height:22px;fill:#5F6368;flex:none}\n.mode{margin:-8px 0 22px}.mode p{font-size:13px;color:var(--muted);margin:0 0 6px}\n.sb .notch{position:absolute;left:50%;top:8px;width:92px;height:24px;margin-left:-46px;background:var(--tinta);border-radius:14px}\n.sb svg{width:26px;height:11px}\n.bar{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;height:62px;flex:none;background:var(--menta);border-bottom:1px solid var(--borde)}\n\n.bar .iso{width:38px;height:auto;flex:none}\n.bar .url{flex:1;min-width:0;font-size:12.5px;color:var(--muted);background:var(--menta);border-radius:999px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.net{font-size:14px;font-weight:600;color:var(--verde);display:flex;align-items:center;gap:4px}\n.net i{width:8px;height:8px;border-radius:50%;background:var(--verde);display:block}\n.net.off{color:var(--ambar-t)}.net.off i{background:var(--ambar)}\nmain{flex:1;overflow-y:auto;padding:12px 16px 20px;scroll-behavior:smooth}\nmain h2{font-size:26px;margin:6px 0 4px}\n.sub{font-size:16.5px;color:var(--muted);margin-bottom:14px}\n.tabs{display:flex;border-top:1px solid var(--borde);background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}\n.tabs button{flex:1;padding:8px 0 10px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;line-height:1.15}.tabs button[aria-current=true]{box-shadow:inset 0 3px 0 var(--verde);background:#F1F7F4}\n.tabs button[aria-current=true]{color:var(--verde)}\n.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n\n.btn{font:600 17px/20px var(--fb);min-height:52px;padding:14px 24px;border-radius:999px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s}\n.btn:active{transform:scale(.98)}\n.btn.p{background:var(--verde);color:var(--crema)}.btn.p:hover{background:var(--verde-h)}\n.btn.a{background:var(--ambar);color:var(--tinta)}\n.btn.s{border-color:var(--borde-s);color:var(--tinta);background:transparent}\n.btn.sm{min-height:44px;padding:10px 18px;font-size:15px;width:auto}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;margin-bottom:12px}\n.row{display:flex;align-items:center;gap:12px}\n.grow{flex:1;min-width:0}\n.lbl{font:600 14px/18px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:block}\n.field{margin-bottom:12px}\ninput,select{font:400 17px/24px var(--fb);width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta)}\ninput:focus{outline:3px solid var(--ambar);outline-offset:0;border-color:var(--tinta)}\n.hint{font-size:15px;color:var(--muted);margin-top:4px}\n.chip{display:inline-flex;align-items:center;gap:6px;font:600 13.5px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--ambar);color:var(--tinta)}\n.chip.v{background:var(--menta);color:var(--verde)}\n.chip.g{background:#eef0ef;color:var(--muted)}\n.chip.r{background:#f7e3e1;color:var(--danger)}\n.folio{font:600 34px/1 var(--fd);letter-spacing:.08em;color:var(--verde)}\n.folio.sm{font-size:20px}\n\n/* hoy */\n.hero{background:var(--verde);color:var(--crema);border-radius:20px;padding:18px;margin-bottom:12px}\n.hero .big{font:600 44px/1 var(--fd)}\n.hero p{font-size:14px;opacity:.92}\n.tap{display:flex;align-items:center;gap:14px;background:#fff;border:2px dashed var(--borde-s);border-radius:16px;padding:14px;margin-bottom:12px;text-align:left;width:100%}\n.tap svg{width:44px;height:44px;flex:none}\n.tap b{display:block;font:500 18px/1.2 var(--fd)}\n.tap span{font-size:15px;color C122 -25.31 94.69 2 61 2C27.31 2 0 -25.31 0 -59ZM26.78 -59C26.78 -40.1 42.1 -24.78 61 -24.78C79.9 -24.78 95.22 -40.1 95.22 -59C95.22 -77.9 79.9 -93.22 61 -93.22C42.1 -93.22 26.78 -77.9 26.78 -59Z\"/><\/g><\/svg>\n\n  <h1>Activar un display en 3 toques.<span>Sin pantallas pesadas.<\/span><\/h1>\n  <p>Mockup interactivo del panel que usarías en campo (admin.bienvisto.com.mx). Prueba cada pantalla en el teléfono; no hay datos reales ni llamadas a Google.<\/p>\n  <div class=\"jump\" id=\"jump\" role=\"group\" aria-label=\"Ir a una pantalla\">\n   <button data-go=\"hoy\">1 · Hoy<\/button><button data-go=\"activar\">2 · Activar (toque NFC)<\/button><button data-go=\"lote\">3 · Lote<\/button><button data-go=\"displays\">4 · Displays<\/button><button data-go=\"detalle\">5 · Detalle<\/button><button data-go=\"pago\">6 · Cobro<\/button><button data-go=\"saldo\">7 · Mi saldo<\/button><button data-go=\"cuenta\">8 · Mis datos de cobro<\/button><button data-go=\"perfil\">9 · Mi cuenta<\/button><button data-go=\"desempeno\">10 · Mi desempeño<\/button><button data-go=\"ventas\">11 · Mis ventas<\/button>\n  <\/div>\n  <div class=\"mode\" id=\"mode\" role=\"group\" aria-label=\"Cómo se abre el panel\"><p>Cómo se abre el panel:<\/p><div class=\"jump\" style=\"margin:0\"><button data-mode=\"chrome\" aria-pressed=\"true\">En Chrome (navegador)<\/button><button data-mode=\"pwa\" aria-pressed=\"false\">Instalada como app (sin barra)<\/button><\/div><\/div>\n  <div class=\"notes\">\n   <div class=\"note\"><h3>Qué hace rápido a esta interfaz<\/h3><p>Una sola página HTML con CSS y JS propios, sin frameworks. Fuentes de marca en WOFF2 variable (~65 KB). Cada pantalla es HTML que ya está en el dispositivo: cambiar de pantalla no pide nada a la red.<\/p>\n   <div class=\"meter\"><div><b>~110 KB<\/b><span>peso total, con fuentes<\/span><\/div><div><b>0<\/b><span>librerías externas<\/span><\/div><div><b>1<\/b><span>llamada: la búsqueda del negocio<\/span><\/div><\/div><\/div>\n   <div class=\"note\"><h3>Optimista y tolerante a mala señal<\/h3><p>Al tocar «Activar» el display queda activo en pantalla al instante; el guardado va en segundo plano con reintento. Si no hay señal, la activación con efectivo o transferencia se queda en cola (enviar los datos de cuenta por WhatsApp sí necesita señal) y avisa con el indicador de arriba (prueba «Sin señal» en la pantalla Hoy). Los displays y clientes se descargan una vez y se filtran en el teléfono, no en el servidor.<\/p><\/div>\n   <div class=\"note\"><h3>Vive en el navegador<\/h3><p>La barra de dirección la dibuja Chrome, no la app: el panel solo pinta su logo y el menú. La altura usa el área visible real, así que sigue cabiendo cuando Chrome oculta su barra al hacer scroll. Si el vendedor la instala en la pantalla de inicio, se abre sin barra (prueba «Instalada como app»). En iPhone, Chrome y Safari ponen su barra abajo; por eso la barra de pestañas respeta el margen inferior.<\/p><\/div>\n   <div class=\"note\"><h3>Facturación<\/h3><p>Al activar aparece un aviso que no se cierra con un toque fuera de él: obliga a preguntar «¿tu cliente necesita factura?». Si sí, el celular del vendedor muestra un QR que el cliente escanea para llenar sus datos fiscales; si no está presente, un botón le manda el enlace y las reglas del CFDI por WhatsApp y correo. Si el vendedor lo pospone, la venta queda marcada en su lista de ventas.<\/p><\/div>\n   <div class=\"note\"><h3>Permisos del vendedor<\/h3><p>Por defecto el vendedor es «Nuevo»: en el detalle de un display solo puede probar el enlace y <i>solicitar<\/i> cambio de negocio, reposición o anulación; Bien Visto aprueba desde el administrador. «Retirar» y «Reactivar» no existen en su panel. Un vendedor «De confianza» (lo decide el administrador) cambia de negocio y repone directo, hasta 2 reposiciones al mes. En «Mi saldo» hay botones para simular ambos niveles y la respuesta de Bien Visto.<\/p><\/div>\n   <div class=\"note\"><h3>Bono mensual<\/h3><p>{{BONNOTA}}<\/p><\/div>\n   <div class=\"note\"><h3>Un flujo, un camino<\/h3><p>El toque NFC abre directo <code>/activar/x4w3<\/code>. Si el display está libre, solo ves el formulario. Si ya está activo, ves su ficha. Nunca eliges «qué quieres hacer» antes de saber qué display es.<\/p><\/div>\n   <div class=\"note\"><h3>Decisiones que conviene validar<\/h3><p>1) El cliente nuevo se escribe una vez y los siguientes displays lo reutilizan desde «Lote». 2) El enlace de reseña se genera solo con el Place ID; tú solo confirmas el negocio y la sucursal. 3) «Retirar» y «Reponer» piden confirmación; «Activar» no, porque se puede deshacer 8 segundos.<\/p><\/div>\n   <div class=\"note\"><h3>Sin señal<\/h3><p>Activar con efectivo o transferencia funciona sin señal y queda en cola. Si al sincronizar el servidor rechaza una venta (tope lleno, display ya usado), aparece como «Rechazada» con el motivo, el display vuelve a libre y tú decides si devuelves el dinero o entregas y reactivas. Enviar los datos de cuenta por WhatsApp sí necesita señal. Prueba los casos en «Mi saldo», sección «Solo para probar el mockup».<\/p><\/div>\n   <div class=\"note\"><h3>Reglas de dinero<\/h3><p>Precio fijo: <b>{{P}}<\/b> con IVA incluido; el vendedor no lo edita. Comisión fija: <b>{{C}}<\/b>. Entrega a Bien Visto: <b>{{E}}<\/b>. Promoción: cada grupo de {{PN}} displays en la misma venta cuesta <b>{{PP}}<\/b>; la comisión no cambia. El vendedor verifica que el pago cayó y, al activar, se compromete a entregar los {{E}} aunque el cliente no haya pagado. Tope de custodia: <b>{{TM}} o {{H}} h<\/b> ({{TN}} los primeros días, hasta tu primera entrega confirmada); al llegar, el panel bloquea nuevas activaciones. Si pasas el plazo y no entregas, Bien Visto puede retirar los displays: los {{E}} quedan como adeudo y bloquean tus activaciones. Si anulan una venta que ya entregaste, se te descuenta de tu siguiente entrega. Cambiar tu cuenta de cobro requiere aprobación de Bien Visto; el recibo del cliente sale {{RM}} minutos después de activar. Si el cliente paga por transferencia, el vendedor le manda con un toque los datos de su cuenta por WhatsApp (desde el número de Bien Visto).<\/p>\n   <div class=\"meter\"><div><b>{{P}}<\/b><span>paga el cliente<\/span><\/div><div><b>{{C}}<\/b><span>comisión<\/span><\/div><div><b>{{E}}<\/b><span>se entrega<\/span><\/div><\/div><\/div>\n  <\/div>\n <\/section>\n\n <div class=\"device\" id=\"device\">\n  <div class=\"sb\" aria-hidden=\"true\"><span>9:41<\/span><i class=\"notch\"><\/i><svg viewBox=\"0 0 28 12\"><rect x=\"0.5\" y=\"0.5\" width=\"23\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"currentColor\"/><rect x=\"2\" y=\"2\" width=\"17\" height=\"8\" rx=\"1.5\" fill=\"currentColor\"/><rect x=\"25\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/><\/svg><\/div>\n  <div class=\"chrome\" id=\"chrome\" aria-hidden=\"true\"><div class=\"omni\"><svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/><\/svg><span id=\"url\">admin.bienvisto.com.mx<\/span><\/div><span class=\"tabn\">1<\/span><svg class=\"dots\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"5\" r=\"1.9\"/><circle cx=\"12\" cy=\"12\" r=\"1.9\"/><circle cx=\"12\" cy=\"19\" r=\"1.9\"/><\/svg><\/div>\n  <div class=\"phone\" id=\"phone\">\n  <div class=\"bar\">\n   <button class=\"bk\" id=\"bk\" hidden aria-label=\"Volver a la pantalla anterior\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>Atrás<\/button>\n   <svg class=\"iso\" id=\"iso\" viewBox=\"0 41 311 203\" aria-label=\"Bien Visto\"><path fill=\"#0E6B5C\" d=\"M62 163 L62 78 A16 16 0 0 0 30 78 L30 163 A16 16 0 0 0 62 163 Z\"/><path fill=\"#0E6B5C\" fill-rule=\"evenodd\" d=\"M30 163 A59 59 0 1 1 148 163 A59 59 0 1 1 30 163 Z M62 163 A27 27 0 1 0 116 163 A27 27 0 1 0 62 163 Z\"/><path fill=\"#F2A71B\" d=\"M159.53 150 L197.35 215.5 A15 15 0 0 0 223.33 215.5 L298.96 84.5 A15 15 0 0 0 272.98 69.5 L210.34 178 L185.51 135 A15 15 0 0 :'Pidió factura'):'';\nconst FAC_REGLAS=[\n 'Tu cliente necesita su RFC, su razón social tal como aparece en su Constancia de Situación Fiscal, su código postal fiscal, su régimen fiscal y el uso que dará al CFDI.',\n 'La factura se emite por el total que pagó el cliente, con IVA incluido: {{P}} por display o {{PP}} por cada grupo de {{PN}} si aprovechó la promoción ({{FN}} displays = {{FP}} + {{FR}} = {{FT}}). Va a nombre de quien capture sus datos. Si compró varios displays en un recibo, es una sola factura por el total del recibo.',\n 'Debe pedirla antes de que termine el mes de la compra.',\n 'Revisa bien el RFC y el régimen antes de enviar: corregir una factura implica cancelarla y emitir otra.',\n 'La factura le llega al correo que capture (PDF y XML). Sin RFC no se puede facturar; el recibo de Bien Visto no es una factura.'];\nconst entDe=v=>entN(v.folios.length)-(v.ab||0),comDe=v=>v.folios.length*COM;\nconst enRevision=()=>V.reduce((a,v)=>a+(v.est==='rev'?entDe(v):0)+(v.revAb||0),0);\nconst enCustodia=v=>v.est==='pend'||v.est==='rev';\nconst enMano=()=>V.filter(enCustodia).reduce((a,v)=>a+entDe(v),0);\nconst horasMax=()=>Math.max(0,...V.filter(enCustodia).map(v=>v.h));\nlet DEUDA=0,DEUDA_F=[],AJ=0,CUP=null;\nconst CUH=[{t:'14 sep 2026',x:'Primera carga de datos de cobro'}];\nconst HOYT='6 oct 2026';\nlet PRUEBA_MIN=30;\nconst enPrueba=()=>D.filter(d=>d.e==='prueba');\nconst stPrueba=(f)=>{const d=get(f);return d&&d.pr};\nconst bloqueo=extra=>DEUDA>0?'deuda':horasMax()>=HORAS?'horas':(enMano()+extra>TOPE?'tope':'');\nconst netoEntrega=()=>Math.max(0,enMano()-AJ);\nconst porAvisar=()=>Math.max(0,enMano()-enRevision()-(S.ajUsado?0:AJ));\nconst msgBloq=b=>b==='deuda'?'Tienes un adeudo de '+mxn(DEUDA)+' por displays que Bien Visto retiró por impago. Liquídalo o regresa los displays para seguir cobrando.':b==='horas'?'Tienes dinero de Bien Visto en tu poder desde hace más de '+HORAS+' h. Entrega para seguir cobrando.':'Esta venta te pasaría del tope de '+mxn(TOPE)+' (hoy tienes '+mxn(enMano())+'). Entrega primero.';\nconst hace=h=>h<1?'Ahora':h<24?'Hace '+h+' h':h<48?'Ayer':h<720?'Hace '+Math.floor(h/24)+' días':'1 sep';\n/* validación del formulario */\nconst ERR_ICON='<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M12 7v6M12 16.5v.5\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/svg>';\nconst soloDig=s=>String(s).replace(/\\D/g,'');\nfunction digWa(s){let d=soloDig(s);if(d.length===12&&d.startsWith('52'))d=d.slice(2);if(d.length===13&&d.startsWith('521'))d=d.slice(3);return d}\nconst fmtWa=s=>{const d=digWa(s);return d.length===10?d.slice(0,2)+' '+d.slice(2,6)+' '+d.slice(6):s};\nfunction errNombre(v){v=v.trim().replace(/\\s+/g,' ');if(!v)return['Escribe el nombre de quien recibe el display.'];\n if(/\\d/.test(v))return['El nombre no lleva números. Bórralos.'];\n if(/@/.test(v))return['Parece que escribiste un correo. Aquí va el nombre de la persona.'];\n if(!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/.test(v))return['El nombre solo lleva letras y espacios. Quita los símbolos.'];\n if(v.length>60)return['El nombre es demasiado largo. Escribe solo nombre y apellido.'];\n const w=v.split(' ').filter(x=>x.replace(/[.'-]/g,'').length);\n if(w.length<2)return['Escribe nombre y apellido. Ejemplo: Rosa Ruiz.'];\n const raro=w.some(x=>{const s=norm(x).replace(/[.'-]/g,'');return /(.)\\1\\1/.test(s)||(s.length>3&&!/[aeiouy]/.test(s))});\n if(raro)return['Revisa el nombre: no parece real. Puede haber un error de dedo.'];\n if(w.every(x=>x.replace(/[.'-]/g,'').length<2))return['Escribe el nombre completo, no solo iniciales.'];\n return['']}\nfunction errWa(v){if(!v.trim())return['Escribe el WhatsApp del cliente.'];\n if(/[a-z]/i.test(v))return['El WhatsApp solo lleva números. Quita las letras.'];\n const d=digWa(v),n=d.length;\n if(n<10)return[`Le falta${10-n===1?'':'n'} ${10-n} dígito${10-n===1?'':'s'}: lleva ${n} de 10. Revisa que incluya la lada (33, 55…).`];\n if(n>10)return[`Le sobra${n-10===1?'':'n'} ${n-10} dígito${n-10===1?'':'s'}: lleva ${n} y deben ser 10. No hace falta el +52 ni el 1.`];\n return['']}\nconst TYPOS={'gmial.com':'gmail.com','gmai.com':'gmail.com','gamil.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','gmail.cm':'gmail.com','gmal.com':'gmail.com','hotmial.com':'hotmail.com','hotmail.con':'hotmail.com','hotmai.com':'hotmail.com','homail.com':'hotmail.com','outlok.com':'outlook.com','outlook.con':'outlook.com','yaho.com':'yahoo.com','yahoo.con':'yahoo.com','yahoo.com.mex':'yahoo.com.mx','icloud.con':'icloud.com'};\nfunction errMail(v){v=v.trim().toLowerCase();if(!v)return[''];\n const at=(v.match(/@/g)||[]).length;\n if(at===0)return['Falta la @. Ejemplo: nombre@gmail.com'];\n if(/\\s/.test(v))return['El correo no lleva espacios. Bórralos.'];\n if(at>1)return['El correo tiene más de una @. Solo debe llevar una.'];\n const [u,dom]=v.split('@');\n if(!u)return['Falta lo que va antes de la @ (el nombre del correo).'];\n if(!dom)return['Falta lo que va después de la @, por ejemplo gmail.com.'];\n if(!dom.includes('.'))return[`Falta el final del correo: ¿${dom}.com?`,u+'@'+dom+'.com'];\n if(/\\.$/.test(dom)||/\\.\\./.test(dom)||!/^[a-z0-9.-]+\\.[a-z]{2,}$/.test(dom))return['La parte después de la @ no se ve bien. Ejemplo: gmail.com u hotmail.com'];\n if(TYPOS[dom])return[`Parece que hay un error de dedo: ¿quisiste decir ${TYPOS[dom]}?`,u+'@'+TYPOS[dom]];\n if(!/^[a-z0-9._%+-]+$/.test(u))return['Antes de la @ solo van letras, números, puntos o guiones. Sin acentos ni ñ.'];\n return['']}\nconst CL=[\n {id:'c1',nombre:'Rosa Ruiz',empresa:'Familia Ruiz',wa:'33 2345 6789',mail:'rosa@familiaruiz.mx'},\n {id:'c2',nombre:'Andrés Tinoco',empresa:'Café Tinto SA',wa:'33 3456 7890',mail:'andres@cafetinto.mx'},\n {id:'c3',nombre:'Mario Peña',empresa:'Barbería El Corte',wa:'33 4567 8901',mail:'mario@elcorte.mx'}];\nconst norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst sucDe=c=>D.filter(x=>x.cl===c.empresa&&x.e==='activo').map(x=>x.su).filter((s,i,a)=>a.indexOf(s)===i);\nconst mark=(s,q)=>{s=String(s);if(!q)return esc(s);const n=norm(s),m=new Array(s.length).fill(false);\n q.split(/\\s+/).filter(Boolean).forEach(w=>{const i=n.indexOf(w);if(i>-1)for(let k=i;k<i+w.length&&k<s.length;k++)m[k]=true});\n let out='',on=false;for(let k=0;k<s.length;k++){if(m[k]!==on){out+=m[k]?'<mark>':'<\/mark>';on=m[k]}out+=esc(s[k])}return out+(on?'<\/mark>':'')};\n/* ayuda contextual */\nconst HELP={\n fac:['Facturación',[\n  ['¿Tengo que preguntar por la factura?','No. El recibo que le llega al cliente ya trae el enlace para pedirla él mismo. Solo si el cliente te la pide frente a ti, entra a la venta y toca «El cliente pide factura».'],\n  ['El cliente sí quiere factura','Muéstrale el QR en tu pantalla para que lo escanee con su cámara y llene el formulario. Si no está contigo, toca «Enviar enlace» y le llega por WhatsApp y correo con las reglas.'],\n  ['¿Qué datos necesita?','RFC, razón social, código postal fiscal, régimen fiscal y uso del CFDI. Lo más fácil es que tenga a la mano su Constancia de Situación Fiscal.'],\n  ['¿Quién emite la factura?','Bien Visto, por el total que pagó el cliente con IVA incluido (por ejemplo {{P}} un display, {{PP}} por {{PN}} con la promoción). Tú no emites ni cobras nada extra por facturar.']]],\n priv:['Aviso de privacidad',[\n  ['¿Qué datos se guardan?','Nombre, WhatsApp y correo de tu cliente, solo para activar su display y mandarle su recibo y su reporte. No se venden ni se comparten. Aviso completo: bienvisto.com.mx/privacidad'],\n  ['¿Qué le digo al cliente?','Que Bien Visto guarda su nombre y contacto para su display y su recibo, y que puede pedir que los borren escribiendo a soporte.']]],\n hoy:['Activar un display',[\n  ['¿Cómo abro un display?','Acerca la parte de arriba de tu celular al ícono NFC del display, o escanea su QR con la cámara. Si está libre, se abre directo el formulario.'],\n  ['Mi celular no reacciona al acercarlo','Revisa que el NFC esté encendido (Android: Ajustes › Conexiones). En iPhone funciona con la pantalla desbloqueada. Si no, usa el QR o teclea el folio.'],\n  ['Mi celular no tiene NFC','Toca «Escanear QR» aquí en el panel. Es mejor que usar la cámara del celular, porque no te saca de tu sesión.'],\n  ['¿Dónde está el folio?','Son 4 caracteres impresos al pie del display y en la etiqueta de abajo. Ejemplo: X4W3.']]],\n act1:['Datos del cliente',[\n  ['¿Qué WhatsApp y correo pongo?','Los de la persona que recibe el display y el reporte mensual: normalmente el dueño o el encargado.'],\n  ['El cliente ya tiene otro display','Toca «¿Ya es cliente? Búscalo» y encuéntralo por su nombre o por el de su negocio. Así no se duplica.']]],\n cl:['Buscar cliente',[\n  ['¿Cómo lo encuentro?','Escribe parte del nombre de la persona (Rosa), del apellido (Ruiz) o del negocio (Tacos). No importan acentos ni mayúsculas.'],\n  ['No aparece','Si nunca le has activado un display, no está en tu lista. Regístralo como cliente nuevo.']]],\n act2:['Encontrar el negocio',[\n  ['¿No aparece el negocio?','Agrega la colonia o la calle: «Tacos La Esquina Patria». Si aun así no sale, puede que no tenga ficha en Google Maps; deja el display libre y escríbenos para darla de alta.'],\n  ['Salen dos negocios con el mismo nombre','Fíjate en la dirección y confírmala con el cliente. Cada sucursal tiene su propia ficha y sus propias reseñas.'],\n  ['El nombre en Google está mal escrito','Elígelo igual. Las reseñas van a esa ficha; corregir el nombre se hace aparte en Google.']]],\n act3:['Confirmar el negocio',[\n  ['¿Cómo sé que es la sucursal correcta?','Lee la dirección en voz alta con el cliente. Si coincide con el local donde estás, es esa.'],\n  ['¿Y si me equivoco?','Tienes 8 segundos para deshacer. Después, entra al display y usa «Cambiar de negocio»; el folio no cambia y no se reimprime nada.']]],\n act4:['Probar el display',[\n  ['¿No se abrió la reseña?','Para escribir una reseña hay que tener sesión de Google en el celular. Prueba con otro teléfono o abre el enlace aquí.'],\n  ['¿Por qué con otro celular?','Así ves exactamente lo que verá un cliente del negocio, no la pantalla de administrador.']]],\n pago:['Cobro y activación',[\n  ['¿Qué pasa si activo sin cobrar?','Al activar te comprometes a entregar {{E}} a Bien Visto por cada display, hayas cobrado o no. Si el cliente no pagó, ese dinero lo pones tú y no ganas la comisión de esa venta.'],\n  ['¿Cuándo uso transferencia?','Cuando el cliente te paga a tu CLABE (la que cargaste en «Mis datos de cobro»). Revisa en tu banco que el dinero ya cayó antes de activar; la clave de rastreo ayuda, pero no sustituye a tu banco.'],\n  ['¿Cómo le mando mis datos al cliente?','Con «Transferencia» elegida, toca «Enviar datos por WhatsApp». El cliente recibe al momento tu titular, banco, CLABE, número de cuenta y tipo de cuenta, con el monto. Se manda desde el WhatsApp de Bien Visto, no desde tu número. Tus datos los cargas una vez en «Mis datos de cobro».'],\n  ['¿Puedo cambiar el precio?','No. Es fijo: {{P}} con IVA incluido. Solo cambia con la promoción: {{PN}} displays en la misma venta cuestan {{PP}}. El cliente lo ve en su recibo.'],\n  ['¿Cómo funciona la promoción de {{PN}} por {{PP}}?','Si el mismo cliente compra {{PN}} displays en la misma venta, paga {{PP}} en vez de {{PSUM}}. Tu comisión sigue siendo {{C}} por display ({{PCOM}} en total) y entregas {{PENT}} a Bien Visto. El descuento lo absorbe Bien Visto. Con {{EXN}} displays serían 2 promociones ({{EXP}}); con {{EYN}}, una promoción más uno de {{P}}. Cuentan los displays de la misma venta, de cualquier tipo.']]],\n saldo:['Mi saldo',[\n  ['¿Cómo se calcula mi saldo?','Sumas los {{E}} de cada venta que cobraste tú (efectivo o transferencia) y aún no entregaste. Tu comisión de {{C}} ya la retuviste al cobrar, así que Bien Visto no te debe nada.'],\n  ['¿Qué es el tope?','Es el máximo de dinero de Bien Visto que puedes tener contigo: {{TM}} o {{H}} horas, lo que ocurra primero. Si eres vendedor nuevo, arrancas con {{TN}} y subes a {{TM}} cuando Bien Visto confirma tu primera entrega. Al llegar, el panel no te deja activar más displays hasta que entregues.'],\n  ['¿Qué es el ajuste a mi favor?','Si Bien Visto anula una venta que ya habías entregado, esos {{E}} se te descuentan de tu siguiente entrega. Tú le devuelves su dinero al cliente.'],\n  ['¿Qué es un adeudo?','Si pasas el plazo de entrega y no avisas, Bien Visto puede retirar esos displays por impago. Los {{E}} de cada uno quedan como adeudo y no puedes activar más hasta liquidarlo o devolver los displays.'],\n  ['¿Cómo entrego?','En mano a Bien Visto o por depósito o transferencia a su cuenta. Toca «Avisar que entregué». Si fue depósito o transferencia, adjunta una foto del comprobante (tómala ahí mismo o súbela de tu galería). Cuando Bien Visto lo confirma, tu saldo baja y te llega un comprobante.']]],\n bloqueo:['Entrega para seguir',[\n  ['¿Por qué no me deja activar?','Tienes dinero de Bien Visto contigo por encima del tope o desde hace más de {{H}} horas. Entrega y se desbloquea al confirmarse.'],\n  ['¿Cuándo se desbloquea?','En cuanto Bien Visto confirma tu entrega y tu saldo baja del tope. Avísala desde «Mi saldo».']]],\n lote:['Activar varios',[\n  ['Mi celular no tiene NFC','Usa «Escanear QR de varios». La cámara se queda abierta y cada QR que lees se suma al lote; al final tocas «Listo».'],\n  ['¿Cuándo uso Lote?','Cuando entregas 2 o más displays al mismo local. Eliges el negocio una vez y solo tocas cada display.'],\n  ['Me equivoqué de display','Tócalo en la lista y elige «Quitar» antes de activar.']]],\n displays:['Buscar displays',[\n  ['¿Qué significa cada estado?','Activo: lleva a reseñas. Libre: en inventario, sin negocio. Retirado: ya no lleva a reseñas y muestra un botón al negocio en Google Maps.']]],\n ventas:['Mis ventas',[\n  ['¿Por qué no veo los datos de mis clientes?','Por privacidad. Tú capturas el contacto una sola vez, al vender; después Bien Visto envía y reenvía los recibos y las facturas por ti, sin que tengas que ver el teléfono ni el correo.'],\n  ['¿Y si el número estaba mal?','Si lo notas al momento, corrígelo en esa misma pantalla. Después, escribe a soporte y lo corrigen.'],\n  ['¿Cuándo recibo mi comisión?','La retienes al cobrar: del dinero del cliente te quedas {{C}}, y entregas el resto a Bien Visto.']]],\n get desempeno(){return BONOS_ON?['Tu mes',[\n  ['¿Cómo se calcula mi premio?','Cada display que entregas y Bien Visto confirma enciende un círculo. Al llegar a los círculos dorados ganas el premio: {{BONL}}. Solo se paga el más alto.'],\n  ['¿Cuándo me pagan?','Los primeros {{DB}} días del mes siguiente, por transferencia a tu cuenta de cobro. Si no la has cargado, no se puede transferir.'],\n  ['¿Mi comisión cambia?','No. Sigues ganando {{C}} por display. El bono es extra.']]]:['Tu mes',[\n  ['¿Qué cuenta como display entregado?','Cuenta cuando Bien Visto confirma tu entrega del dinero, no cuando lo vendes. El mes va del 1 al último día y el día 1 empiezas de cero.'],\n  ['¿Cómo gano mi comisión?','La retienes al cobrar: del dinero del cliente te quedas {{C}} por display y entregas el resto a Bien Visto.']]]},\n detalle:['Cambios a un display',[\n  ['¿Cómo cambio de negocio o repongo un display?','Como vendedor nuevo no lo haces tú: envías una solicitud con el motivo (y una foto si se dañó) y Bien Visto la revisa. Mientras tanto el display sigue funcionando. Los vendedores de confianza lo hacen directo, con hasta {{LR}} reposiciones al mes.'],\n  ['¿Por qué lo revisa Bien Visto?','Un display cambiado o repuesto cambia a dónde van las reseñas de un cliente que ya pagó. Revisarlo evita errores y que se pierdan displays.'],\n  ['¿Puedo retirar un display?','No desde tu panel. Si un cliente ya no lo quiere, pide la anulación de la venta o escribe a Bien Visto.'],\n  ['¿Se pierden los escaneos?  o.querySelector('#rqr').onclick=()=>{o.querySelector('#rrb').hidden=false;o.querySelector('#rrt').focus()};
 o.querySelector('#rrx').onclick=()=>{o.querySelector('#rrb').hidden=true};
 o.querySelector('#rrt').oninput=()=>showErr(o,'rrt','');
 o.querySelector('#rrc').onclick=()=>{const m=o.querySelector('#rrt').value.trim();if(m.length<5){showErr(o,'rrt','Escribe por qué no procede. El vendedor lo ve tal cual.');o.querySelector('#rrt').focus();return}
  q.est='rechazada';q.r=m;log('Rechazó la solicitud de '+(q.tipo==='reponer'?'reposición':'cambio de negocio')+' de '+q.f+' ('+v.n+'): '+m);cerrar();render();toast('Solicitud rechazada. El vendedor ve tu motivo')}}
function nivelSet(id,n){const v=V.find(x=>x.id===id);if(nivel(v)===n)return;cambiarVendedorSrv(id,{nivel:n}).then(()=>{log('Cambió a '+v.n+' a vendedor '+NIVT[n].toLowerCase());vendDlg(id);toast(v.n.split(' ')[0]+' ahora es vendedor '+NIVT[n].toLowerCase())}).catch(e=>toast('No se cambió el nivel: '+e.message))}
function cuAprobar(id){const v=V.find(x=>x.id===id);v.cu={titular:v.cuP.titular,clabe:v.cuP.clabe,cuenta:v.cuP.cuenta,tipo:v.cuP.tipo};v.cuH=(v.cuH||[]).concat([{t:'2026-10-06',x:'Cambio aprobado por '+yo().n+': '+bancoDe(v.cu.clabe)+' ···· '+v.cu.clabe.slice(-4)}]);v.cuP=null;log('Aprobó el cambio de cuenta de cobro de '+v.n);render();vendDlg(id);toast('Cuenta de '+v.n.split(' ')[0]+' actualizada')}
function cuRechazar(id){const v=V.find(x=>x.id===id);v.cuP=null;v.cuH=(v.cuH||[]).concat([{t:'2026-10-06',x:'Cambio rechazado por '+yo().n}]);log('Rechazó el cambio de cuenta de cobro de '+v.n);render();vendDlg(id);toast('Solicitud rechazada. Se conserva su cuenta actual')}
